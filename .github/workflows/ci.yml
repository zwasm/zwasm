# CI — the host-local gate on the 3 supported OSes, mirroring the local
# 3-host gate (Mac aarch64 + Linux x86_64 + Windows x86_64). Each matrix leg
# runs `scripts/ci_gate.sh` so CI verifies exactly what the maintainer runs
# per host (single source of truth); the differential oracle uses wasmtime
# when the install step succeeds.
#
# Triggers: pull_request (any target) + push to `main` + manual dispatch.
# `main` is the trunk and is ruleset-protected: no direct pushes — every change
# lands via a `develop/*` branch → PR → this gate must pass → merge. A push to
# `main` is therefore a merged PR (its `push` run does the extended checks).
#
# Doc-only changes skip the heavy 3-host build/test: the `changes` job detects
# whether any non-doc path changed and short-circuits `gate` when not. So the
# expensive matrix never runs for a pure docs/comment PR — but `ci-required`
# (the single required status check) still reports success, so the PR stays
# mergeable without burning three runners. Keep the branch ruleset's required
# check pointed at `ci-required`, NOT the individual `gate (...)` legs.
#
# The cheap `doc-truth` job runs for EVERY PR, doc-only included — checks whose
# subject is prose must not be skipped by the doc-only short-circuit.
#
# All three legs are blocking (ADR-0211 D3). The Windows leg was advisory
# 2026-07-01..2026-08-19, citing D-245 flakiness that had already been fixed
# and delisted before the flag landed; measured 26/26 green before the flip.
# If hosted-runner flakiness recurs, file a debt row with the measured
# signature and revert that ADR's one-line change — do not re-add a silent
# advisory flag.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether any non-doc path changed. Doc-only PRs then skip the heavy
  # 3-host `gate` matrix while `ci-required` still reports success, so the
  # branch ruleset's required check stays satisfiable. Only SHAs (never a
  # branch name / title / body) reach the shell, so there is no injection seam.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect non-doc changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}...${PR_HEAD}"
          elif [ "$EVENT" = "push" ]; then
            if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              echo "code=true" >> "$GITHUB_OUTPUT"; echo "new-branch push -> run gate"; exit 0
            fi
            range="${PUSH_BEFORE}..${PUSH_HEAD}"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch -> run gate"; exit 0
          fi
          files="$(git diff --name-only "$range")"
          echo "changed files:"; printf '%s\n' "$files"
          # Paths that do NOT need the 3-host build/test gate (docs / meta only).
          nondoc="$(printf '%s\n' "$files" | grep -vE '(^|/)[^/]*\.md$|^docs/|^\.dev/|^\.claude/|^LICENSE$' || true)"
          if [ -n "${nondoc//[[:space:]]/}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "non-doc changes -> run 3-host gate"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "doc-only -> skip 3-host gate"
          fi

  # Doc-truth checks that MUST also run for doc-only PRs — the `gate` matrix
  # below is skipped for those, which is precisely how the "interp is the
  # default engine" claim survived three releases (#163). Cheap, no toolchain.
  doc-truth:
    name: doc-truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Engine-default claims
        shell: bash
        run: bash scripts/check_engine_default_claims.sh --gate
      - name: WASI 0.3 coverage claims
        shell: bash
        run: bash scripts/check_wasi03_coverage_claims.sh --gate
      - name: Doc fossils (prerelease pins + dead script refs)
        shell: bash
        run: bash scripts/check_doc_fossils.sh --gate

  gate:
    name: gate (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runs-on }}
    # 120: the extended (main-push) gate runs the full DCE matrix (~50-70min
    # alone); a cold zig cache pushed the total past the previous 75min cap.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            runs-on: macos-15
            zig-dir: zig-aarch64-macos-0.16.0
            extended: true
          - name: x86_64-linux
            runs-on: ubuntu-22.04
            zig-dir: zig-x86_64-linux-0.16.0
            extended: true
          - name: x86_64-windows
            runs-on: windows-2022
            zig-dir: zig-x86_64-windows-0.16.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # zlinter and its transitive zls tree are dependencies of the lint
      # sub-build only (ADR-0214). Zig unpacks packages into
      # <build root>/zig-pkg, so theirs is ./tools/lint/zig-pkg, and only the
      # extended leg's `zig build lint` resolves them — the core gate now runs
      # with no package fetch at all. Restoring that directory is what removes
      # the fetch (measured: with it present, lint completes offline against
      # an empty global cache). Cached because a transient
      # TLS failure on that fetch would otherwise fail the gate no matter what
      # the change was — observed as "unable to discover remote git server
      # capabilities: TlsInitializationFailed".
      - name: Cache Zig package deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/lint/zig-pkg
          key: zig-pkg-${{ matrix.name }}-${{ hashFiles('tools/lint/build.zig.zon') }}
          restore-keys: |
            zig-pkg-${{ matrix.name }}-

      - name: Cache Zig 0.16.0
        id: cache-zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/zig-0.16.0
          key: zig-0.16.0-${{ matrix.name }}

      - name: Install Zig 0.16.0 (Unix)
        if: runner.os != 'Windows' && steps.cache-zig.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local
          curl -fsSL "https://ziglang.org/download/0.16.0/${{ matrix.zig-dir }}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C ~/.local
          mv "$HOME/.local/${{ matrix.zig-dir }}" "$HOME/.local/zig-0.16.0"

      - name: Install Zig 0.16.0 (Windows)
        if: runner.os == 'Windows' && steps.cache-zig.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.local" | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:TEMP\zig.zip"
          Expand-Archive -Path "$env:TEMP\zig.zip" -DestinationPath "$HOME\.local" -Force
          Move-Item -Path "$HOME\.local\zig-x86_64-windows-0.16.0" -Destination "$HOME\.local\zig-0.16.0"

      - name: Add Zig to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$HOME/.local/zig-0.16.0" >> "$GITHUB_PATH"

      - name: Add Zig to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.local\zig-0.16.0"

      # Reference oracle for the interp-vs-JIT-vs-wasmtime differential. Best
      # effort: the differential runner degrades to a SKIP when it is absent,
      # so a download hiccup must not fail the gate.
      - name: Install wasmtime (reference oracle, best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          v="v${WASMTIME_VERSION}"
          case "${{ runner.os }}" in
            Linux)   asset="wasmtime-${v}-x86_64-linux";   ext="tar.xz" ;;
            macOS)   asset="wasmtime-${v}-aarch64-macos";  ext="tar.xz" ;;
            Windows) asset="wasmtime-${v}-x86_64-windows"; ext="zip"    ;;
          esac
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${v}/${asset}.${ext}"
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          if [ "$ext" = "zip" ]; then
            curl -fsSL "$url" -o wasmtime.zip && unzip -j -o wasmtime.zip
          else
            curl -fsSL "$url" -o wasmtime.tar.xz && tar -xJf wasmtime.tar.xz --strip-components=1 "${asset}/wasmtime"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Build-time dependency: the default `zig build` installs
      # zwasm-spec-wasm-2-0-assert, which embeds spectest.wasm produced by
      # `wasm-tools parse` from test/spec/spectest.wat (build.zig). Required
      # (not best-effort) — even a plain build fails without it.
      - name: Install wasm-tools (build-time, required for any zig build)
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          v="${WASM_TOOLS_VERSION}"
          case "${{ runner.os }}" in
            Linux)   asset="wasm-tools-${v}-x86_64-linux";   ext="tar.gz" ;;
            macOS)   asset="wasm-tools-${v}-aarch64-macos";  ext="tar.gz" ;;
            Windows) asset="wasm-tools-${v}-x86_64-windows"; ext="zip"    ;;
          esac
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${v}/${asset}.${ext}"
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          if [ "$ext" = "zip" ]; then
            curl -fsSL "$url" -o wt.zip && unzip -j -o wt.zip
          else
            curl -fsSL "$url" -o wt.tar.gz && tar -xzf wt.tar.gz --strip-components=1 "${asset}/wasm-tools"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          zig version
          wasm-tools --version
          wasmtime --version || echo "wasmtime absent — differential will SKIP"

      # Extended checks (lint + 9-combo × 2-arch build-DCE matrix + ReleaseSafe
      # JIT smoke + AOT cross-compile) are up to ~20 cold-cache ReleaseSafe builds
      # and dominate wall-clock (~2.5-4.5 min/build on hosted runners), so they
      # run ONLY on the merge to `main` (push) — not on every PR / dispatch, which
      # get the fast core gate (fmt + test-all, ~10 min). windows is always core.
      - name: ci_gate.sh
        shell: bash
        env:
          ZWASM_CI_EXTENDED: ${{ (github.event_name == 'push' && matrix.extended) && '1' || '0' }}
        run: bash scripts/ci_gate.sh

      # Official wasi-testsuite wasm32-wasip1 corpus (D-582). ADVISORY: the
      # corpus reports 14 engine-independent failures today (D-583), so a
      # blocking placement would red every PR. Step-level `continue-on-error`
      # keeps the step's `outcome` as `failure` (visible in the run) while its
      # `conclusion` — and therefore the job's, and therefore
      # `needs.gate.result` that `ci-required` reads — stays `success`.
      #
      # PUSH-ONLY since 2026-08-24. The paragraph above is exactly why: a
      # failure here could not block a PR and never could, so the 175 s it
      # cost on every PR bought no gate signal — measured at `c294ac99f`,
      # 135 s on the macOS leg plus 40 s across linux and windows. It still
      # runs on the merge to `main`, the same window `ZWASM_CI_EXTENDED`
      # already accepts for its own checks, so the corpus verdict stays a
      # per-merge number. D-583's 14 known failures are unaffected either way.
      #
      # Deliberately a step in THIS job rather than a job of its own: a
      # separate job would repeat the Zig install and rebuild zwasm from a cold
      # `.zig-cache` on all three runners (nothing caches `.zig-cache`), paying
      # a second full build per PR to run two lanes over 72 small binaries.
      # Here it reuses what `ci_gate.sh` just built.
      #
      # Time-boxed in the ADR-0174 sense, not indefinite: when D-583's 14 go
      # green on all three OSes the step moves into `test-all` and this block
      # is deleted.
      - name: test-wasi-p1-official (advisory, D-582)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: zig build test-wasi-p1-official

  # The SINGLE required status check (point the branch ruleset here, not at the
  # individual `gate (...)` legs). Passes when the change was doc-only (gate
  # skipped by design) OR when the 3-host gate succeeded. `always()` so it also
  # runs when `gate` was skipped. All three legs are blocking (ADR-0211 D3), so
  # `needs.gate.result` is 'success' only when Mac + Linux + Windows all pass.
  ci-required:
    name: ci-required
    needs: [changes, doc-truth, gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          # Bracket form is required: `needs.doc-truth.result` parses the `-`
          # as a subtraction operator, not as part of the job id.
          DOC_TRUTH_RESULT: ${{ needs['doc-truth'].result }}
          GATE_RESULT: ${{ needs.gate.result }}
        shell: bash
        run: |
          set -euo pipefail
          # doc-truth runs unconditionally (doc-only PRs skip `gate`, and docs
          # are exactly what it guards), so it is a hard requirement here.
          if [ "$DOC_TRUTH_RESULT" != "success" ]; then
            echo "::error::doc-truth did not pass (result=$DOC_TRUTH_RESULT)"
            exit 1
          fi
          # D-520 (2026-07-09, seen live on PR #139): when `changes` itself
          # FAILS (runner-acquisition flake), its `code` output is EMPTY —
          # which used to fall into the doc-only PASS branch below with the
          # gate matrix silently skipped. A failed detection must never be
          # read as "doc-only".
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::detect-changes did not succeed (result=$CHANGES_RESULT) — cannot trust the doc-only skip"
            exit 1
          fi
          if [ "$CODE" != "true" ]; then
            echo "doc-only change — 3-host gate intentionally skipped; PASS"
            exit 0
          fi
          echo "gate result: $GATE_RESULT"
          if [ "$GATE_RESULT" = "success" ]; then
            echo "3-host gate passed; PASS"
            exit 0
          fi
          echo "::error::3-host gate did not pass (result=$GATE_RESULT)"
          exit 1
