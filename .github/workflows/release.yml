# Release — build ReleaseSafe binaries for all supported targets and publish a
# GitHub Release. Zig cross-compiles every target from a single Linux runner,
# so no cross-job artifact plumbing is needed (only the pinned checkout action).
#
# TRIGGER: a maintainer pushing a `v*` tag (a deliberate, human act — the
# autonomous loop never tags or releases; ADR-0156), or manual dispatch.
#
# NOTE: aarch64-macos is cross-linked from Linux using Zig's bundled macOS
# libSystem stubs. Validate the macOS artifact on the first real release; if the
# cross-link is unsatisfactory, split that target onto a native macos runner.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only cut a Release for FINAL version tags (v2.0.0). Pre-release tags
    # (-rc/-alpha/-beta) are tag-only — no build, no Release, Latest unchanged —
    # matching the v2 pre-release strategy. Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          mkdir -p ~/.local
          dir="zig-x86_64-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${dir}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C ~/.local
          echo "$HOME/.local/${dir}" >> "$GITHUB_PATH"

      # The default `zig build` install set includes the spec-assert test exes,
      # which run `wasm-tools parse` at build time to generate spectest.wasm
      # (build.zig ~L263). ci.yml installs wasm-tools for the same reason; the
      # release build (Linux host, cross-compiling every target) needs the
      # host's Linux wasm-tools regardless of the -Dtarget.
      - name: Install wasm-tools (build-time; spectest.wasm generation)
        shell: bash
        run: |
          set -euo pipefail
          source .github/versions.lock
          asset="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${asset}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          curl -fsSL "$url" -o wt.tar.gz
          tar -xzf wt.tar.gz --strip-components=1 "${asset}/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build + package all targets (ReleaseSafe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build_one() {
            local target="$1" artifact="$2" pkg="$3"
            echo "::group::build $target"
            rm -rf zig-out
            zig build -Doptimize=ReleaseSafe -Dtarget="$target"
            if [ "$pkg" = zip ]; then
              cp zig-out/bin/zwasm.exe dist/zwasm.exe
              ( cd dist && zip -q "${artifact}.zip" zwasm.exe && rm zwasm.exe )
            else
              cp zig-out/bin/zwasm dist/zwasm
              ( cd dist && tar czf "${artifact}.tar.gz" zwasm && rm zwasm )
            fi
            echo "::endgroup::"
          }
          build_one aarch64-macos   zwasm-macos-aarch64   tar.gz
          build_one x86_64-linux    zwasm-linux-x86_64    tar.gz
          build_one aarch64-linux   zwasm-linux-aarch64   tar.gz
          build_one x86_64-windows  zwasm-windows-x86_64  zip
          ( cd dist && for f in *.tar.gz *.zip; do sha256sum "$f"; done > SHA256SUMS )
          ls -l dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          # Idempotent: the release may already exist because a maintainer cut
          # it by hand right after pushing the tag (ADR-0156 makes releasing a
          # deliberate human act, so that ordering is normal, not a mistake).
          # An unconditional `create` fails with "a release with the same tag
          # name already exists" and takes the ARTIFACT UPLOAD down with it —
          # the tag then has hand-written notes and no binaries, which is worse
          # than either half alone. Happened on v2.4.1.
          gh release view "$TAG_NAME" >/dev/null 2>&1 \
            || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
